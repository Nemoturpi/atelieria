<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AleVia — Validation de la veille</title>
<title>Validation de la veille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  :root { --accent: #b22234; --accent-2: #8e1b2a; --ink: #1c1d22; --ink-mute: #6c6f76; --cream: #faf8f4; --card: #ffffff; --line: #e8e4da; --gold: #a8853b; --grey-z: #71717a; --step-keep: #00a86b; --step-grey: #8b8f98; --step-bulletin: #2478ff; --step-manual: #9b5de5; --step-generate: #ff9f1c; --step-list: #06a6c9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--cream); color: var(--ink); }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 32px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  header img.logo { height: 46px; display: block; }
  header .sub { font-size: 13px; color: var(--ink-mute); letter-spacing: .02em; }
  header .navlinks { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header .navlink { border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; color: var(--ink); text-decoration: none; font-family: 'Inter Tight', sans-serif; font-size: 13px; font-weight: 650; background: #fff; }
  header .navlink:hover { border-color: var(--step-bulletin); color: var(--step-bulletin); }
  header .hdr-info { margin-left: 0; font-size: 12px; color: var(--ink-mute); }
  main { max-width: 1480px; margin: 0 auto; padding: 24px 18px 90px; }
  .legend { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 18px; }
  .legend summary { cursor: pointer; padding: 13px 18px; font-size: 13.5px; font-weight: 500; color: var(--ink); list-style: none; display: flex; align-items: center; gap: 8px; }
  .legend summary::before { content: '?'; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; }
  .legend[open] summary { border-bottom: 1px solid var(--line); }
  .legend .legend-body { padding: 14px 18px 18px; font-size: 13.5px; line-height: 1.65; color: var(--ink-mute); }
  .legend .legend-body p { margin: 0 0 10px; }
  .legend .lg-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  .stats-legend { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stats-legend .lg-row { display: grid; grid-template-columns: minmax(150px, 190px) minmax(0, 1fr); gap: 12px; align-items: start; color: var(--ink-mute); font-size: 13px; line-height: 1.45; }
  .stats-legend .badge { justify-self: start; white-space: nowrap; font-weight: 600; color: var(--ink); }
  .bigbtn .arrow { margin-left: 8px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(28,29,34,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .panel { background: #fff; border-radius: 8px; padding: 28px; max-width: 580px; width: 100%; max-height: 88vh; overflow: auto; }
  .panel.wide { max-width: 760px; }
  .panel h2 { font-family: 'Inter Tight', sans-serif; margin-top: 0; font-size: 19px; }
  .panel .hint { font-size: 12.5px; color: var(--ink-mute); margin-top: 10px; line-height: 1.6; }
  .field-label { display: block; margin: 14px 0 6px; font-size: 12px; color: var(--ink-mute); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
  .manual-field { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; font-family: 'Inter', sans-serif; color: var(--ink); background: #fffefb; }
  .manual-field:focus { outline: none; border-color: var(--accent); }
  .manual-text { min-height: 110px; resize: vertical; line-height: 1.5; }
  .manual-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--cream); display: grid; gap: 6px; }
  .manual-item strong { font-family: 'Inter Tight', sans-serif; font-size: 14px; }
  .manual-item p { margin: 0; font-size: 13px; line-height: 1.45; color: #4a4d55; }
  .manual-item a, .manual-item span { font-size: 12px; color: var(--ink-mute); word-break: break-word; }
  pre.prompt { white-space: pre-wrap; font-size: 12px; background: var(--cream); border: 1px solid var(--line); padding: 14px; border-radius: 10px; max-height: 45vh; overflow: auto; font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 22px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }
  .faq-section { margin-top: 28px; }
  .faq-head { margin-bottom: 4px; }
  .faq-title { font-family: 'Inter Tight', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1; margin: 3px 0 0; letter-spacing: 0; }
  .faq-section .legend { margin-bottom: 0; }
  .faq-body { display: grid; gap: 10px; }
  .faq-section .legend-body { max-width: 980px; }
  .faq-section .legend-body ul { margin: 0; padding-left: 18px; }
  .faq-section .legend-body li { margin: 0 0 6px; }
.logo-text { font-family: 'Inter Tight', sans-serif; font-size: 24px; font-weight: 700; color: var(--ink); }
  footer { text-align: center; font-size: 11.5px; color: var(--ink-mute); padding: 26px; border-top: 1px solid var(--line); background: #fff; }
  footer .gold { color: var(--gold); }
  @media (max-width: 1180px) { .generate-layout { grid-template-columns: 1fr; } }
  @media (max-width: 980px) { .list-row { grid-template-columns: 1fr; } .list-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 680px) { header { padding: 12px 16px; } header .hdr-info { margin-left: 0; } .stage-nav, .split-list, .stats-legend .lg-row, .card-radar, .stage-toolbar { grid-template-columns: 1fr; } .stage-title { font-size: 42px; } .stage-head { font-size: 28px; } .bar { align-items: stretch; } .bar select, .bar button, .bigbtn { width: 100%; } .stage-viewbar { justify-content: stretch; padding-left: 0; border-left: 0; border-top: 1px solid var(--line); padding-top: 10px; } .stage-viewbar .view-toggle { width: 100%; } .list-actions { grid-template-columns: 1fr; } }
</style>
</head>
